services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: loyalty_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loyalty_net

  nginx:
    image: nginx:1.27-alpine
    container_name: loyalty_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - loyalty_net

  mysql:
    image: mysql:8.0
    container_name: loyalty_mysql
    environment:
      MYSQL_DATABASE: loyalty_db
      MYSQL_USER: loyalty_user
      MYSQL_PASSWORD: loyalty_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - loyalty_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: loyalty_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loyalty_net

volumes:
  mysql_data:


networks:
  loyalty_net:
    driver: bridge
